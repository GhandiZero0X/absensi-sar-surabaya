                            <i class="bi bi-three-dots-vertical" style="font-size: 1.5rem; color: #333;"></i>
                        </button>

                        <div class="collapse d-md-flex align-items-center" id="headerIconsCollapse">
                            <div class="header-icons-wrapper d-flex gap-3 p-2 p-md-0 mt-2 mt-md-0">
                                <a href="{{ url_for('main.view_kepegawaian_cari_data_pegawai') }}"
                                    class="btn p-0 border-0 bg-transparent shadow-none text-decoration-none">
                                    <i class="bi bi-search" style="color: #333; font-size: 1.1rem;"></i>
                                </a>

                                <button class="btn p-0 border-0 bg-transparent shadow-none">
                                    <i class="bi bi-file-earmark-plus" style="color: #0d6efd; font-size: 1.2rem;"></i>
                                </button>
                                <button class="btn p-0 border-0 bg-transparent shadow-none">
                                    <i class="bi bi-save" style="color: #198754; font-size: 1.2rem;"></i>
                                </button>

                                <button class="btn p-0 border-0 bg-transparent shadow-none">
                                    <i class="bi bi-trash" style="color: #dc3545; font-size: 1.2rem;"></i>
                                </button>
                            </div>

                        font-size: 0.9rem;
                        padding: 6px 15px;
                        width: 100%;

                    .input-custom-style {
                        border: 1px solid #ccc;
                        border-radius: 3px;
                        padding: 3px 8px;
                        font-size: 0.85rem;
                        width: 100%;
                        background-color: #fff;
                        position: relative;
                        z-index: 1;
                    }

                    input[type="date"].input-custom-style {
                        cursor: pointer;
                        min-height: 31px;
                    }

                    .input-custom-style:focus {
                        border-color: #e66b30;
                        outline: none;
                    }

                    .form-label-custom {
                        font-size: 0.85rem;
                        color: #333;
                        font-weight: 500;
                        margin-bottom: 0;
                    }

                    .dropdown-toggle-custom {
                        border: 1px solid #ccc;
                        background-color: #fff;
                        font-size: 0.85rem;
                        padding: 3px 8px;
                        border-radius: 3px;
                    }

                    .custom-dropdown-scroll {
                        max-height: 200px;
                        overflow-y: auto;
                    }

                    .dropdown-item-custom {

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const checkAll = document.getElementById("checkAllUnit");
        const items = document.querySelectorAll(".check-unit-item");
        const label = document.getElementById("dropdownLabelUnit");

        // Fungsi memperbarui teks tombol berdasarkan nama unit yang dicentang
        function updateLabel() {
            const checkedItems = document.querySelectorAll(".check-unit-item:checked");

            if (checkedItems.length === 0) {
                label.innerText = "Pilih Unit Kerja";
            } else if (checkedItems.length === items.length) {
                label.innerText = "Semua Unit Terpilih";
            } else {
                // Mengambil nilai text/value dari item yang dicentang lalu digabung dengan koma
                const selectedNames = Array.from(checkedItems).map(item => item.value);
                label.innerText = selectedNames.join(", ");
            }
        }

        if (checkAll) {
            checkAll.addEventListener("change", function () {
                items.forEach(item => {
                    item.checked = checkAll.checked;
                });
                updateLabel();
            });
        }

        items.forEach(item => {
            item.addEventListener("change", function () {
                const checkedCount = document.querySelectorAll(".check-unit-item:checked").length;
                if (checkAll) checkAll.checked = (checkedCount === items.length);
                updateLabel();
            });
        });
    });
</script>
{% endblock %}
