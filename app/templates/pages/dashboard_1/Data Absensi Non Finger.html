<!-- pages/dashboard_1/Laporan Absensi Non Finger.html -->
{% extends "layout/baseDashboard1.html" %}

{% block title %}- Data Absensi Non Finger{% endblock %}

{% block content %}
<div class="nxl-content">
    <div class="page-header">
        <div class="page-header-left d-flex align-items-center">
            <div class="page-header-title">
                <h5 class="m-b-10">Data Absensi</h5>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="Data Absensi Non Finger.html">Absensi Non Finger</a></li>
                <li class="breadcrumb-item">Edit</li>
            </ul>
        </div>
    </div>

    <div class="main-content master-siaga">
        <div class="container-fluid">
            <div class="card mb-4 filter-card">
                <div class="card-header-custom d-flex justify-content-between align-items-center"
                    style="border-radius: 10px;">
                    <h6 class="mb-0">
                        <i class="ti ti-user-check me-2"></i> Absensi Non Finger
                    </h6>
                    <div class="header-actions">
                        <button class="btn p-0 border-0 bg-transparent shadow-none d-md-none" type="button"
                            data-bs-toggle="collapse" data-bs-target="#headerIconsCollapse">
                            <i class="bi bi-three-dots-vertical" style="font-size: 1.5rem; color: #333;"></i>
                        </button>
                        <div class="collapse d-md-flex align-items-center" id="headerIconsCollapse">
                            <div class="header-icons-wrapper d-flex gap-3 p-2 p-md-0 mt-2 mt-md-0">
                                <a href="Cari Absensi Non Finger.html"
                                    class="btn p-0 border-0 bg-transparent shadow-none text-decoration-none">
                                    <i class="bi bi-search" style="color: #333; font-size: 1.1rem;"></i>
                                </a>
                                <button class="btn p-0 border-0 bg-transparent shadow-none">
                                    <i class="bi bi-file-earmark-plus" style="color: #0d6efd; font-size: 1.2rem;"></i>
                                </button>
                                <button class="btn p-0 border-0 bg-transparent shadow-none">
                                    <i class="bi bi-save" style="color: #198754; font-size: 1.2rem;"></i>
                                </button>

                                <button class="btn p-0 border-0 bg-transparent shadow-none">
                                    <i class="bi bi-trash" style="color: #dc3545; font-size: 1.2rem;"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-body">
                    <div class="row g-3">
                        <!-- Pegawai -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Pegawai</label>
                            <div class="col-md-3">
                                <input type="text" class="form-control-sm border w-100" name="pegawai">
                            </div>
                        </div>

                        <!-- Tanggal -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Tanggal</label>
                            <div class="col-md-3">
                                <div class="input-group-custom w-100">
                                    <input type="text" class="form-control-sm border w-100" placeholder="Tgl Kerja">
                                    <span class="icon-append"><i class="bi bi-calendar3"></i></span>
                                </div>
                            </div>
                        </div>

                        <!-- Shift -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Shift</label>
                            <div class="col-md-3">
                                <select class="form-select-sm border custom-select w-100">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                </select>
                            </div>
                        </div>

                        <!-- Status -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Status *</label>
                            <div class="col-md-7 d-flex gap-5">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="statusIn" name="status_in">
                                    <label class="form-check-label fw-bold" for="statusIn">In</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="statusOut" name="status_out">
                                    <label class="form-check-label fw-bold" for="statusOut">Out</label>
                                </div>
                            </div>
                        </div>

                        <!-- Pendukung -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Pendukung</label>
                            <div class="col-md-3 me-md-4 mb-2 mb-md-0">
                                <select class="form-select-sm border custom-select w-100">
                                    <option>Tanpa Pendukung</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select class="form-select-sm border custom-select w-100">
                                    <option>Tanpa Pendukung</option>
                                </select>
                            </div>
                        </div>

                        <!-- Jam -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Jam</label>
                            <div class="col-md-3 me-md-4 mb-2 mb-md-0">
                                <div class="input-group-custom w-100">
                                    <input type="text" class="form-control-sm border w-100">
                                    <span class="icon-append"><i class="bi bi-clock"></i></span>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="input-group-custom w-100">
                                    <input type="text" class="form-control-sm border w-100">
                                    <span class="icon-append"><i class="bi bi-clock"></i></span>
                                </div>
                            </div>
                        </div>

                        <!-- Jam Baku -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Jam Baku</label>
                            <div class="col-md-7">
                                <!-- Kosong sesuai gambar -->
                            </div>
                        </div>

                        <!-- Keterangan -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Keterangan</label>
                            <div class="col-md-3 me-md-4 mb-2 mb-md-0">
                                <input type="text" class="form-control-sm border w-100">
                            </div>
                            <div class="col-md-3">
                                <input type="text" class="form-control-sm border w-100">
                            </div>
                        </div>

                        <!-- Total -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Total</label>
                            <div class="col-md-7">
                                <span>( )</span>
                            </div>
                        </div>

                        <!-- Tingkat -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Tingkat</label>
                            <div class="col-md-7"></div>
                        </div>

                        <!-- Potongan -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Potongan</label>
                            <div class="col-md-7"></div>
                        </div>

                        <!-- Valid -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Valid</label>
                            <div class="col-md-7"></div>
                        </div>

                        <!-- Simulate -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Simulate</label>
                            <div class="col-md-7">
                                <button type="button" class="btn btn-sm btn-orange-figma text-white fw-bold px-3"
                                    style="background-color: #E29526; border: none;">Koreksi</button>
                            </div>
                        </div>

                        <!-- Update -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">Update</label>
                            <div class="col-md-7"></div>
                        </div>

                        <!-- by -->
                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold mb-1 mb-md-0">by</label>
                            <div class="col-md-7"></div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}

{% endblock %}
